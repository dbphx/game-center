<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/hub.css">
</head>
<body>
  <header class="topbar hidden" id="topbar">
    <a class="brand" href="/">🎲 <span class="brand-text">Game Hub</span></a>
    <span class="spacer"></span>
    <div class="user">
      <button class="link user-name" id="user-name" title="Đổi tên"></button>
      <span class="coins" id="balance"></span>
      <button class="primary" id="btn-daily">🎁 Nhận thưởng</button>
    </div>
  </header>

  <!-- Lần đầu vào: tạo tài khoản khách -->
  <section class="center-screen hidden" id="welcome">
    <div class="panel">
      <h1>🎲 Game Hub</h1>
      <p class="muted center">Tổ hợp game chơi cùng bạn bè, dùng chung một ví xu.<br>Tài khoản mới được tặng <b id="start-coins"></b> xu.</p>
      <label>Tên của bạn
        <input id="name" maxlength="16" placeholder="Nhập tên" autocomplete="nickname">
      </label>
      <button id="btn-start" class="primary wide">Bắt đầu chơi</button>
    </div>
  </section>

  <main class="hub hidden" id="hub">
    <section>
      <h2>Chọn game</h2>
      <div class="games" id="games"></div>
    </section>
    <section>
      <h2>Lịch sử xu</h2>
      <p class="muted">Xu chỉ dùng để chơi cho vui, không quy đổi ra tiền thật. Mỗi ngày nhận thưởng một lần.</p>
      <ul class="history" id="history"></ul>
    </section>
  </main>

  <script src="/account.js"></script>
  <script src="/hub.js"></script>
</body>
</html>
