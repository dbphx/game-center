<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nông trại · DCity</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/farm/farm.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><i data-icon="arrowLeft"></i><span id="logo"></span><span class="brand-text">DCity</span></a>
    <span class="spacer"></span>
    <div class="user">
      <span class="hp-pill" id="hp-pill" title="Máu"></span>
      <span class="level-badge" id="level-badge" title="Kinh nghiệm"></span>
      <span class="wallet-pill"><i data-icon="coins"></i><span id="balance"></span></span>
      <span class="user-chip"><span id="user-avatar"></span><span class="user-chip-name" id="user-name"></span></span>
    </div>
  </header>

  <main class="farm hidden" id="farm">
    <!-- Cả nông trại là một cảnh liền rộng theo chiều ngang: cổng, 2 kho, ruộng, chuồng, ao. Chiều dọc vừa khung nhìn,
         chiều ngang cuộn / kéo tự do; camera bám theo nhân vật. Bảng điều khiển nổi trên cảnh. -->
    <section class="stage" id="stage">
      <section class="scene" id="scene">
        <div class="world-wrap" id="world-wrap">
          <div class="world" id="world">
            <div id="objects"></div>
            <div class="walker" id="me"><span class="me-tag" id="me-tag"></span><span class="me-body" id="me-body"></span></div>
            <span class="go-mark hidden" id="go-mark"></span>
            <button class="hint hidden" id="hint" data-hint><kbd>E</kbd><span></span></button>
          </div>
        </div>
      </section>

      <div class="farm-hud">
        <div class="farm-title">
          <span class="farm-icon"><i data-icon="sprout"></i></span>
          <div>
            <h1 id="farm-name">Nông trại</h1>
            <p class="help">WASD / mũi tên hoặc bấm chuột để đi · kéo để xem ngang · E để thao tác</p>
          </div>
        </div>
      </div>
      <!-- Thanh công cụ kiểu game: chọn công cụ rồi bấm ô đất, nhân vật đi tới làm -->
      <button id="btn-harvest-all" class="primary harvest-all hidden"><i data-icon="sprout"></i><span>Thu hoạch tất cả</span></button>
      <div class="tool-tip hidden" id="tool-tip"></div>
      <div class="seed-pick hidden" id="seed-pick"></div>
      <nav class="toolbar" id="toolbar"></nav>
      <div class="pan-btns">
        <button class="icon-only" data-pan="-1" title="Xem sang trái"><i data-icon="arrowLeft"></i></button>
        <button class="icon-only" data-pan="me" title="Về chỗ nhân vật"><i data-icon="user"></i></button>
        <button class="icon-only flip" data-pan="1" title="Xem sang phải"><i data-icon="arrowLeft"></i></button>
      </div>
    </section>
  </main>

  <!-- Cửa hàng: hạt giống (mua vào kho giống), vật nuôi, cá. Mở từ một ô trống thì để chọn hạt gieo vào ô đó. -->
  <dialog class="modal shop-dlg" id="dlg-shop">
    <div class="shop-wrap">
      <div class="shop-head">
        <h2><i data-icon="gift"></i><span id="shop-title">Cửa hàng</span></h2>
        <button class="link icon-only" data-close title="Đóng"><i data-icon="x"></i></button>
      </div>
      <div class="tabs shop-tabs" role="tablist" id="shop-tabs">
        <button class="tab active" data-tab="crops">Hạt giống</button>
        <button class="tab" data-tab="animals">Vật nuôi</button>
        <button class="tab" data-tab="fish">Cá</button>
      </div>
      <p class="muted shop-note" id="shop-note"></p>
      <div class="shop-list" id="shop-list"></div>
    </div>
  </dialog>

  <!-- Kho giống / kho sản phẩm -->
  <dialog class="modal shop-dlg store-dlg" id="dlg-store">
    <div class="shop-wrap">
      <div class="shop-head">
        <h2><i data-icon="landmark"></i><span id="store-title">Kho</span></h2>
        <button class="link icon-only" data-close title="Đóng"><i data-icon="x"></i></button>
      </div>
      <div id="store-body"></div>
    </div>
  </dialog>

  <!-- Chuồng / ao: sức chứa, mở rộng, danh sách con nuôi -->
  <dialog class="modal shop-dlg" id="dlg-pen">
    <div class="shop-wrap">
      <div class="shop-head">
        <h2><i data-icon="landmark"></i><span id="pen-title">Chuồng</span></h2>
        <button class="link icon-only" data-close title="Đóng"><i data-icon="x"></i></button>
      </div>
      <div id="pen-body" class="pen-body"></div>
    </div>
  </dialog>

  <script src="/icons.js"></script>
  <script src="/character.js"></script>
  <script src="/account.js"></script>
  <script src="/farm/farm.js"></script>
</body>
</html>
