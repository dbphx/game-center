# DCity — giống các app khác trên máy: container app + container cloudflared riêng (tunnel "dcity").
services:
  dcity-app:
    build: .
    image: dcity-app
    container_name: dcity-app
    restart: unless-stopped
    environment:
      # Đăng nhập bằng Google (Client ID là thông tin công khai, nằm sẵn trong trang web).
      GOOGLE_CLIENT_ID: 470545887694-ljl9jj1ng8hqgukgrov5ou4k8rmmfhis.apps.googleusercontent.com
    volumes:
      - ./data:/data

  dcity-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dcity-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/dcity.yml run
    volumes:
      - /home/dbx-linux/.cloudflared:/etc/cloudflared
    depends_on:
      - dcity-app
