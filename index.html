<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiến Lên Miền Nam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="table">
    <div class="seat seat-2" data-seat="2"></div>
    <div class="seat seat-3" data-seat="3"></div>
    <div class="seat seat-1" data-seat="1"></div>

    <div class="center">
      <div class="pile" id="pile"></div>
      <div class="pile-label" id="pile-label"></div>
    </div>

    <div class="seat seat-0" data-seat="0"></div>

    <div class="controls">
      <button id="btn-play" class="primary">Đánh</button>
      <button id="btn-pass">Bỏ lượt</button>
      <button id="btn-hint">Gợi ý</button>
      <button id="btn-clear">Bỏ chọn</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <aside class="side">
    <h2>Điểm</h2>
    <table id="scores"></table>
    <h2>Diễn biến</h2>
    <ul id="log"></ul>
  </aside>

  <div class="overlay hidden" id="overlay">
    <div class="dialog">
      <h2 id="result-title"></h2>
      <ol id="result-list"></ol>
      <button id="btn-new" class="primary">Ván mới</button>
    </div>
  </div>

  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
